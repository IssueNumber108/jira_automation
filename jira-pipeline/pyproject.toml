[project]
name = "jira-pipeline"
version = "1.0.0"
description = "Modular Jira data pipeline with analytics and PDF reporting"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pandas>=2.1",
    "requests>=2.31",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
jira-pipeline = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
