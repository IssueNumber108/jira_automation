[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jira-analyser"
version = "0.1.0"
description = "Jira issue analysis toolkit — bulk fetch, field inspection, validation and plotting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "python-dotenv>=1.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.22",
    "pandas>=2.2",
    "cryptography>=42.0",
    "rich>=13.7",
    "typer>=0.12",
    "tenacity>=8.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
    "mypy>=1.10",
    "coverage>=7.5",
]

[project.scripts]
jira-analyser = "jira_analyser.pipeline.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/jira_analyser"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
